[package]
name = "webtmux"
description = "web-tmux desktop shell (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "webtmux"
path = "src/lib.rs"

[[bin]]
name = "webtmux"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.3" }
gpui-component = { workspace = true }
webtmux-supervisor = { workspace = true }
webtmux-settings = { workspace = true }
webtmux-backend-client = { workspace = true }
webtmux-terminal = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
raw-window-handle = "=0.6.2"
reqwest = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }
