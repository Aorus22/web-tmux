<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tmux GUI: tiled terminal panes with a prompt -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#1E1E1E" stroke="#3C3C3C" stroke-width="14"/>
  <!-- pane dividers -->
  <line x1="272" y1="120" x2="272" y2="408" stroke="#3C3C3C" stroke-width="16" stroke-linecap="round"/>
  <line x1="272" y1="264" x2="448" y2="264" stroke="#3C3C3C" stroke-width="16" stroke-linecap="round"/>
  <!-- prompt -->
  <path d="M140 216 L195 264 L140 312" fill="none" stroke="#4ADE80" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="215" y="250" width="44" height="28" rx="8" fill="#4ADE80"/>
  <!-- top-right pane lines -->
  <rect x="308" y="160" width="88" height="20" rx="10" fill="#808080"/>
  <rect x="308" y="192" width="56" height="20" rx="10" fill="#555555"/>
  <!-- bottom-right pane status -->
  <circle cx="324" cy="336" r="13" fill="#4ADE80"/>
  <rect x="348" y="326" width="72" height="20" rx="10" fill="#808080"/>
</svg>
