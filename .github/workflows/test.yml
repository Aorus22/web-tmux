name: Test

# Rust workspace tests for the desktop client. The runner is docker/Dockerfile.test,
# i.e. the same system headers CI builds the AppImage with.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: test-caches-${{ runner.os }}-${{ hashFiles('desktop-gpui/Cargo.lock') }}
          restore-keys: |
            test-caches-${{ runner.os }}-

      - name: Build test image
        run: docker build -f docker/Dockerfile.test -t webtmux-test .

      - name: Run tests
        run: |
          # The cargo workspace lives in desktop-gpui/, so run from there.
          docker run --rm \
            -v "$PWD:/src" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -w /src/desktop-gpui \
            webtmux-test cargo test --workspace --locked

      # The container runs as root, so the mount-backed cargo cache returns
      # root-owned (and read-only for unpacked sources); actions/cache would
      # then fail to tar it. Hand it back to the runner.
      - name: Fix cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo" || true
