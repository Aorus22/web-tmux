name: Build AppImage

# The AppImage is produced by docker/Dockerfile.build via docker/build-appimage.sh,
# so CI and a local run use byte-identical toolchains (see docker/README.md).

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo / go / npm downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/go/pkg/mod
            ~/.npm
          key: build-caches-${{ runner.os }}-${{ hashFiles('desktop-gpui/Cargo.lock', 'be/go.sum', 'fe/package-lock.json') }}
          restore-keys: |
            build-caches-${{ runner.os }}-

      - name: Build builder image
        run: docker build -f docker/Dockerfile.build -t webtmux-build .

      - name: Build AppImage
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/src" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -v "$HOME/go/pkg/mod:/root/go/pkg/mod" \
            -v "$HOME/.npm:/root/.npm" \
            -w /src \
            webtmux-build bash docker/build-appimage.sh

      - name: Show artifact
        run: |
          ls -l dist
          cat dist/SHA256SUMS.txt

      # The build container runs as root, so the mount-backed caches come back
      # root-owned (cargo also unpacks registry sources read-only) and the
      # actions/cache post step would then fail to tar them. Hand them back.
      - name: Fix cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo" "$HOME/go" "$HOME/.npm" || true

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Tmux-GUI-AppImage-${{ github.sha }}
          path: |
            dist/Tmux-GUI-*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
