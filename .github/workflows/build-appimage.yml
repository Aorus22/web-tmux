name: Build AppImage

# The AppImage is produced by docker/Dockerfile.build via docker/build-appimage.sh,
# so CI and a local run use byte-identical toolchains (see docker/README.md).
#
# What each ref gets:
#   develop  -> Actions artifact only (download to try a branch build)
#   main     -> Actions artifact + rolling "latest" GitHub Release
#   v* tag   -> versioned GitHub Release
#
# The rolling release keeps a stable download URL:
#   https://github.com/<owner>/<repo>/releases/download/latest/Tmux-GUI-0.1.0-x86_64.AppImage

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo / go / npm downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/go/pkg/mod
            ~/.npm
          key: build-caches-${{ runner.os }}-${{ hashFiles('desktop-gpui/Cargo.lock', 'be/go.sum', 'fe/package-lock.json') }}
          restore-keys: |
            build-caches-${{ runner.os }}-

      - name: Build builder image
        run: docker build -f docker/Dockerfile.build -t webtmux-build .

      - name: Build AppImage
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/src" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -v "$HOME/go/pkg/mod:/root/go/pkg/mod" \
            -v "$HOME/.npm:/root/.npm" \
            -w /src \
            webtmux-build bash docker/build-appimage.sh

      - name: Show artifact
        run: |
          ls -l dist
          cat dist/SHA256SUMS.txt

      # The build container runs as root, so the mount-backed caches come back
      # root-owned (cargo also unpacks registry sources read-only) and the
      # actions/cache post step would then fail to tar them. Hand them back.
      - name: Fix cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo" "$HOME/go" "$HOME/.npm" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tmux-GUI-AppImage-${{ github.sha }}
          path: |
            dist/Tmux-GUI-*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # A main push keeps the rolling `latest` release current, a v* tag
      # publishes that tag. Same assets either way, so a download URL stays
      # valid across merges.
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APPIMAGE="$(ls dist/Tmux-GUI-*.AppImage | head -1)"
          SHA256="$(sha256sum "${APPIMAGE}" | cut -d' ' -f1)"
          VERSION="$(basename "${APPIMAGE}" | sed -E 's/^Tmux-GUI-([0-9.]+)-.*/\1/')"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Tmux GUI ${TAG}"
            # The tag is what triggered this run, so it already exists.
            CREATE_ARGS=(--verify-tag)
          else
            TAG="latest"
            TITLE="Tmux GUI - latest from main"
            # Rolling tag: create it on the first main build, then just move
            # the assets along on later ones.
            CREATE_ARGS=(--target "${GITHUB_SHA}")
          fi

          {
            echo "AppImage v${VERSION} built from \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "| asset | sha256 |"
            echo "| --- | --- |"
            echo "| \`$(basename "${APPIMAGE}")\` | \`${SHA256}\` |"
            echo
            echo "Download:"
            echo
            echo '```bash'
            echo "gh release download ${TAG} --repo ${GITHUB_REPOSITORY} --pattern '*.AppImage'"
            echo "chmod +x $(basename "${APPIMAGE}")   # Release assets lose the exec bit"
            echo "./$(basename "${APPIMAGE}")"
            echo '```'
            echo
            echo "Direct link:"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "${APPIMAGE}")"
            echo
            echo "Verify with the attached \`SHA256SUMS.txt\`:"
            echo
            echo '```bash'
            echo "gh release download ${TAG} --repo ${GITHUB_REPOSITORY} --pattern 'SHA256SUMS.txt'"
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
          } > notes.md

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APPIMAGE}" dist/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file notes.md
          else
            gh release create "${TAG}" "${APPIMAGE}" dist/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file notes.md "${CREATE_ARGS[@]}"
          fi

          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url,assets \
            --jq '.url, (.assets[] | "  " + .name + "  " + (.size | tostring) + " bytes")'
